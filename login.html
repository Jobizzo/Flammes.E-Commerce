<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Flammes E-Commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --google-blue: #4285F4;
            --bg-main: #0F111A;
            --bg-card: #1A1D2B;
            --border: #2B2F45;
            --text-primary: #FFFFFF;
            --text-secondary: #A8A9C6;
            --input-bg: #24283B;
            --error: #F53F3F;
            --divider: #383C52;
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%; max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand-logo {
            width: 56px; height: 56px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #FF452B);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900; color: white;
            margin: 0 auto 12px;
        }
        .brand h1 { font-size: 24px; color: var(--primary); margin-bottom: 4px; }
        .brand p { color: var(--text-secondary); font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500;
            color: var(--text-secondary);
        }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-secondary); font-size: 18px;
        }
        input {
            width: 100%; padding: 14px 14px 14px 44px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
        .btn {
            width: 100%; padding: 14px;
            border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-google { background: white; color: #333; margin-top: 14px; }
        .btn-google:hover { background: #f5f5f5; transform: translateY(-1px); }
        .btn-google img { width: 20px; height: 20px; }
        .divider {
            display: flex; align-items: center; gap: 14px; margin: 24px 0;
        }
        .divider hr { flex: 1; border: none; height: 1px; background: var(--divider); }
        .divider span { color: var(--text-secondary); font-size: 13px; }
        .error-msg {
            color: var(--error); font-size: 13px; margin-top: 12px;
            padding: 10px; background: rgba(245,63,63,0.1);
            border-radius: 8px; display: none;
        }
        .loading { display: none; text-align: center; margin-top: 12px; color: var(--text-secondary); font-size: 14px; }
        .forgot-link { text-align: right; margin-top: 8px; }
        .forgot-link a { color: var(--primary); font-size: 13px; text-decoration: none; }
        .footer {
            text-align: center; margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary); font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-logo">F</div>
            <h1>FLAMMES</h1>
            <p>Super Admin — Secure Access 🔒</p>
        </div>

        <!-- Google Sign-In Button -->
        <button class="btn btn-google" onclick="signInWithGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                <path fill="#4285F4" d="M24 9.5c3.15 0 5.3 1.37 6.5 2.53l4.7-4.7C32.6 4.3 28.55 2 24 2 14.8 2 7.3 7.5 4.6 15.35l5.5 4.3C11.3 13.1 16.9 9.5 24 9.5z"/>
                <path fill="#34A853" d="M46.6 24.5c0-1.55-.14-3.05-.4-4.5H24v9h12.7c-.55 2.9-2.15 5.35-4.55 7l7.3 5.7c4.25-3.9 6.15-9.65 6.15-16z"/>
                <path fill="#FBBC05" d="M10.1 25.85c-.5-1.45-.75-3-.75-4.6s.25-3.15.75-4.6L4.6 12.1C3.2 14.9 2.4 18.1 2.4 21.5s.8 6.6 2.2 9.4l5.5-4.3z"/>
                <path fill="#EA4335" d="M24 44c4.55 0 8.5-1.5 11.4-4.1l-7.3-5.7c-2 1.35-4.55 2.15-7.1 2.15-7.1 0-12.6-4.6-14.7-11.05l-5.5 4.3C7.3 39.5 14.8 44 24 44z"/>
            </svg>
            Sign in with Google
        </button>

        <!-- Divider -->
        <div class="divider">
            <hr><span>or use email</span><hr>
        </div>

        <!-- Email/Password Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="forgot-link">
                    <a href="#" onclick="alert('Password reset sent to your email! ✅'); return false;">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>

            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i> Invalid email or password. Please try again.
            </div>

            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Verifying credentials...
            </div>
        </form>

        <div class="footer">
            Powered by FLAMMES-TECH 🔥 | Flammes E-Commerce Platform<br>
            © 2026 — Unauthorized access is prohibited
        </div>
    </div>

    <script>
        // 🔐 YOUR ADMIN CREDENTIALS — SET YOUR EMAIL & PASSWORD
        const ADMIN_EMAIL = 'flamesjobizzo@gmail.com;  // ← YOUR admin email
        const ADMIN_PASSWORD = 'Flammes@2026';       // ← YOUR secure password

        // Check if already logged in
        if (localStorage.getItem('flammes_admin_authed') === 'true') {
            window.location.href = 'superadmin.html';
        }

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');

        // 📧 Email + Password Login
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            errorMsg.style.display = 'none';
            loading.style.display = 'block';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            setTimeout(() => {
                loading.style.display = 'none';
                
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    localStorage.setItem('flammes_admin_authed', 'true');
                    localStorage.setItem('flammes_admin_user', email);
                    localStorage.setItem('auth_method', 'email');
                    window.location.href = 'superadmin.html';
                } else {
                    errorMsg.style.display = 'block';
                    document.getElementById('password').value = '';
                }
            }, 800);
        });

        // 🔵 Google Sign-In
        function signInWithGoogle() {
            errorMsg.style.display = 'none';
            loading.style.display = 'block';

            // Simulate Google OAuth flow — in production, integrate Firebase Auth or Google OAuth
            setTimeout(() => {
                loading.style.display = 'none';
                
                // For demo — show setup instructions
                const proceed = confirm(
                    "🔵 Google Sign-In Setup:\n\n" +
                    "For full Google OAuth integration:\n" +
                    "1. Go to console.cloud.google.com → Create OAuth Credentials\n" +
                    "2. Add Authorized JavaScript origins\n" +
                    "3. Replace this simulation with real Google Auth API\n\n" +
                    "✅ For now — use Email & Password login below!"
                );
                
                if (proceed) {
                    document.getElementById('email').focus();
                }
            }, 1000);
        }
    </script>
</body>
</html>
